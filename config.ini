# 🌡️ Configuration du système de climatisation hybride
# Ce fichier contient les paramètres de configuration du système

# ===================================
# 🔧 CONFIGURATION GÉNÉRALE
# ===================================

# Ports d'écoute
BACKEND_PORT=5000
FRONTEND_PORT=5173

# Mode par défaut au démarrage
DEFAULT_MODE=automatic

# Intervalle de mise à jour (en secondes)
UPDATE_INTERVAL=5

# ===================================
# 📡 CONFIGURATION ARDUINO
# ===================================

# Port série Arduino (auto-détection si vide)
ARDUINO_PORT=

# Vitesse de communication série
BAUD_RATE=9600

# Timeout de communication (en secondes)
ARDUINO_TIMEOUT=5

# ===================================
# 🌡️ SEUILS DE TEMPÉRATURE
# ===================================

# Température optimale (°C)
OPTIMAL_TEMPERATURE=22

# Seuil de déclenchement du mode hybride (°C)
HYBRID_THRESHOLD=25

# Seuil de déclenchement du mode compression (°C)
COMPRESSION_THRESHOLD=28

# Seuil de déclenchement du mode solaire (°C)
SOLAR_THRESHOLD=20

# ===================================
# 💧 DÉTECTION DE FUITES
# ===================================

# Seuil de détection des fuites (valeur du capteur)
LEAK_THRESHOLD=80

# Seuil critique de fuite
CRITICAL_LEAK_THRESHOLD=90

# ===================================
# 🚨 ALERTES ET NOTIFICATIONS
# ===================================

# Activer les alertes par email
EMAIL_ALERTS=false

# Activer les alertes sonores
SOUND_ALERTS=false

# Activer les alertes visuelles
VISUAL_ALERTS=true

# ===================================
# 📊 SIMULATION ET TESTS
# ===================================

# Mode simulation (sans Arduino)
SIMULATION_MODE=true

# Générer des données de test
GENERATE_TEST_DATA=true

# Afficher les logs détaillés
DEBUG_MODE=true

# ===================================
# 🎨 INTERFACE UTILISATEUR
# ===================================

# Thème par défaut
DEFAULT_THEME=dark

# Langue par défaut
DEFAULT_LANGUAGE=fr

# Rafraîchissement automatique du dashboard
AUTO_REFRESH=true

# ===================================
# 🔐 SÉCURITÉ
# ===================================

# Activer l'authentification
ENABLE_AUTH=false

# Clé secrète pour les sessions
SECRET_KEY=your-secret-key-here

# CORS autorisés
CORS_ORIGINS=http://localhost:5173

# ===================================
# 💾 STOCKAGE DES DONNÉES
# ===================================

# Répertoire de stockage des logs
LOG_DIRECTORY=logs

# Répertoire de stockage des données
DATA_DIRECTORY=data

# Format des fichiers de log
LOG_FORMAT=%(asctime)s - %(name)s - %(levelname)s - %(message)s

# ===================================
# 🔄 MODES DE FONCTIONNEMENT
# ===================================

# Configuration des modes
[MODE_SOLAR]
led_pin=9
description="Mode solaire - Économique et écologique"
conditions="Température < 20°C ET Soleil disponible"

[MODE_COMPRESSION]
led_pin=10
description="Mode compression - Refroidissement rapide"
conditions="Température > 28°C OU Urgence"

[MODE_HYBRID]
led_pin=11
description="Mode hybride - Équilibre performance/économie"
conditions="20°C < Température < 28°C"

[MODE_AUTOMATIC]
led_pin=12
description="Mode automatique - Gestion intelligente"
conditions="Décision basée sur l'IA et les conditions"
